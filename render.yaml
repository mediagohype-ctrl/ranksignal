# Render Blueprint — one always-on web service that also runs the background job worker
# (RUN_WORKER_IN_APP=true). Database is Neon (external), so no Render database is declared.
# Secrets are marked sync:false: Render asks for their values when you create the Blueprint.
services:
  - type: web
    name: ranksignal
    runtime: node
    region: singapore # closest Render region to the Neon database (ap-southeast-1)
    plan: starter # always-on; the free plan sleeps, which stops scans mid-run
    buildCommand: npm ci && npm run build
    # Migrations run once per deploy AFTER a successful build and BEFORE the new instance takes traffic; a
    # failed migration aborts the deploy and the old instance keeps serving. Running them in buildCommand
    # changed the live DB even when the build later failed.
    # Write migrations expand/contract: the OLD code keeps running against the NEW schema until the switch, so
    # (1) expand — add nullable columns/tables/indexes only; (2) deploy code that writes/reads both;
    # (3) contract — drop/rename/NOT NULL in a later deploy, once nothing reads the old shape.
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start
    # SIGTERM → the worker stops claiming, gives scans 20s then releases them to the queue, and lets
    # website-change runs finish (or flags them needs_review). Keep this above ~45s.
    maxShutdownDelaySeconds: 60
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.18.0"
      - key: RUN_WORKER_IN_APP
        value: "true"
      - key: NEXT_MANUAL_SIG_HANDLE # let src/instrumentation.ts drain the job worker on SIGTERM, then exit
        value: "true"
      - key: ALLOW_SIMULATED_PROVIDER
        value: "false"
      - key: OPENROUTER_VISIBILITY_MODELS
        value: openai/gpt-6.1-sol,google/gemini-3.8-flash,perplexity/sonar,anthropic/claude-opus-5.5,x-ai/grok-4.7 # priority order; plans cap the count (getEngineLimit)
      - key: OPENROUTER_ANALYSIS_MODELS
        value: anthropic/claude-opus-5.5,openai/gpt-6.1-sol
      - key: OPENROUTER_WEB_ENGINE
        value: native
      - key: SESSION_SECRET
        generateValue: true
      - key: CREDENTIALS_KEY # must be 64 hex chars — paste one, don't let Render generate it
        sync: false
      - key: APP_URL # e.g. https://ranksignal.onrender.com, later your own domain
        sync: false
      - key: DATABASE_URL # Neon pooled URL with &pgbouncer=true
        sync: false
      - key: DIRECT_URL # Neon direct (non -pooler) URL, used by prisma migrate deploy
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PLAN_STARTER
        sync: false
      - key: RAZORPAY_PLAN_GROWTH
        sync: false
      - key: RAZORPAY_PLAN_AGENCY
        sync: false
      - key: AI_DAILY_BUDGET_USD # platform-wide daily AI spend cap (hard stop); default 5
        sync: false
      - key: NEXT_PUBLIC_TURNSTILE_SITE_KEY # bot check on the free check
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: EMAIL_FROM # e.g. RankSignal <hello@yourdomain.com>
        sync: false
      - key: RESEND_API_KEY # or SMTP_HOST/SMTP_PORT/SMTP_SECURE/SMTP_USER/SMTP_PASS
        sync: false
      - key: GOOGLE_CLIENT_ID # "Continue with Google"; add {APP_URL}/api/auth/google/callback as a redirect URI
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STAFF_ALERT_EMAIL # who gets staff alerts (AI spend 80%, job/payment failed, trial ending)
        sync: false
      - key: STAFF_WHATSAPP # optional, E.164
        sync: false
      - key: WHATSAPP_TOKEN # optional: Meta WhatsApp Cloud API
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_UPDATE_TEMPLATE # approved template name for customer updates ({{1}} = message text)
        sync: false
