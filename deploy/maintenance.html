<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!-- Shown by nginx for the few seconds the app restarts during a deploy (deploy/server-setup.sh). Reloads itself. -->
<meta http-equiv="refresh" content="6">
<title>MyWebRank · Back in a moment</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #ffffff; color: #0b1530;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  .logo { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; letter-spacing: .01em; }
  .logo b { color: #4338ca; }
  .mark { width: 32px; height: 32px; border-radius: 8px; background: #4338ca; display: inline-grid; place-items: center; }
  h1 { font-size: 24px; margin: 28px 0 8px; letter-spacing: -.02em; }
  p { margin: 0 auto; max-width: 22rem; color: #4a5470; line-height: 1.55; }
  .spin { width: 28px; height: 28px; margin: 24px auto 0; border: 3px solid #e4e6ef; border-top-color: #4338ca; border-radius: 50%;
          animation: s 0.9s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  a { color: #128c7e; font-weight: 600; }
</style>
</head>
<body>
  <main>
    <div class="logo"><span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><rect x="3" y="13" width="4" height="8" rx="1"/><rect x="10" y="9" width="4" height="12" rx="1"/><rect x="17" y="5" width="4" height="16" rx="1"/></svg></span>MYWEB<b>RANK</b></div>
    <h1>Back in a few seconds</h1>
    <p>We're updating the website. This page reloads by itself.</p>
    <div class="spin" aria-hidden="true"></div>
    <p style="margin-top:24px;font-size:14px">Need us now? <a href="https://wa.me/918447788703">Chat on WhatsApp</a></p>
  </main>
</body>
</html>
